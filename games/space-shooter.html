<html>
    <head>
        <title>Game Loop</title>

        <style>
            /* Remove margins and never show scrollbars */
            *{
                margin:0;
                overflow: hidden;
            }
        </style>
    </head>

    <body>
        <canvas id="canv">

        </canvas>

        <script src="../engine/Vector2.js"></script>
        <script src="../engine/Input.js"></script>
        <script src="../engine/Engine.js"></script>

        <script>
            
            let position = new Vector2(50, 50)

            

            function update() {
                console.log(Input.keysDown)

                if(Input.keysDown.includes("KeyD"))
                    position.x = position.x + 1
                if(Input.keysDown.includes("KeyA"))
                    position.x = position.x - 1
                if(Input.keysDown.includes("KeyW"))
                    position.y = position.y - 1
                if(Input.keysDown.includes("KeyS"))
                    position.y = position.y + 1
            }

            function draw(ctx){
                
                

                //Signaling to the context that I'm going to draw something
                ctx.save()

                //Set center of our object
                ctx.translate(position.x, position.y)

                ctx.lineTo(100, -50)
                ctx.lineTo(90, -40)
                ctx.lineTo(100, 50)
                ctx.lineTo(-100, 50)
                ctx.lineTo(-90, -40)
                ctx.lineTo(-90, -40)
                ctx.lineTo(-100, -50)
                

                ctx.fillStyle = "black"
                //tell canvas to draw object
                ctx.fill()

                //Signaling that I'm done drawing
                ctx.restore()
            }

            Engine.start()
        </script>
    </body>
</html>
